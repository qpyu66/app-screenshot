defaults:
  layout: ad
  text_align: left
  frame_color: black
  fit_mode: cover
  output_dir: ./output_ad

platforms:
  - apple_iphone

screenshots:
  - input: ./screens/home.png
    headline: "오늘 수업,\n한눈에\n파악하세요"
    subtitle: "출결 현황부터 학생 등록 요청까지\n실시간으로 확인하세요"
    background:
      type: solid
      color: "#3b2a1a"

  - input: ./screens/search.png
    headline: "과제도 앱에서\n바로 제출"
    subtitle: "사진·파일·텍스트,\n원하는 방식으로 간편하게"
    background:
      type: solid
      color: "#2a4a2a"
