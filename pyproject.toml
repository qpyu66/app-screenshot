[project]
name = "appshot"
version = "0.1.0"
description = "앱스토어 스크린샷 자동 생성 CLI 도구"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
]

[project.scripts]
appshot = "appshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appshot"]
